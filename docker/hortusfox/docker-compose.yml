version: "3.8"

services:
  app:
    image: ghcr.io/danielbrendel/hortusfox-web:latest
    ports:
      - "${HORTUSFOX_APP_PORT:-8080}:80"
    volumes:
      - app_images:/var/www/html/public/img
      - app_logs:/var/www/html/app/logs
      - app_backup:/var/www/html/public/backup
      - app_themes:/var/www/html/public/themes
      - app_migrate:/var/www/html/app/migrations
    environment:
      APP_ADMIN_EMAIL: ${HORTUSFOX_APP_ADMIN_EMAIL}
      APP_ADMIN_PASSWORD: ${HORTUSFOX_APP_ADMIN_PASSWORD}
      APP_TIMEZONE: ${HORTUSFOX_APP_TIMEZONE}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${HORTUSFOX_MARIADB_DATABASE}
      DB_USERNAME: ${HORTUSFOX_MARIADB_USER}
      DB_PASSWORD: ${HORTUSFOX_MARIADB_PASSWORD}
      DB_CHARSET: "utf8mb4"
    depends_on:
      - db

  db:
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${HORTUSFOX_MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${HORTUSFOX_MARIADB_DATABASE}
      MARIADB_USER: ${HORTUSFOX_MARIADB_USER}
      MARIADB_PASSWORD: ${HORTUSFOX_MARIADB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  app_images:
  app_logs:
  app_backup:
  app_themes:
  app_migrate:
